<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Intelligence - Professional Cryptocurrency Tracker</title>
    <meta name="description" content="Track 500+ cryptocurrencies with real-time prices, market cap, news and detailed analysis">
    <meta name="keywords" content="cryptocurrency, bitcoin, ethereum, crypto prices, market cap, blockchain">
    
    <!-- SEO & Social Media -->
    <meta property="og:title" content="Crypto Intelligence - Professional Crypto Tracker">
    <meta property="og:description" content="Real-time cryptocurrency prices, market analysis and news">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://babcty.github.io/crypto-intelligence-web/">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="logo">🚀 Crypto Intelligence</h1>
            <p class="tagline">Professional Cryptocurrency Tracker</p>
            <div class="nav-buttons">
                <button class="nav-btn active" onclick="showSection('coins')">🪙 Coins</button>
                <button class="nav-btn" onclick="showSection('news')">📰 News</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Coins Section -->
        <section id="coins-section" class="section active">
            <div class="container">
                <!-- Search Bar -->
                <div class="search-container">
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="search-input" 
                        placeholder="🔍 Search 500+ cryptocurrencies..."
                        onkeyup="searchCoins(this.value)"
                    >
                </div>

                <!-- Results Counter -->
                <div class="results-counter">
                    <span id="resultsCount">Loading...</span> cryptocurrencies found
                </div>

                <!-- Loading State -->
                <div id="loading" class="loading-container">
                    <div class="spinner"></div>
                    <p>Loading market data...</p>
                </div>

                <!-- Coins Grid -->
                <div id="coinsGrid" class="coins-grid"></div>
            </div>
        </section>

        <!-- News Section -->
        <section id="news-section" class="section">
            <div class="container">
                <h2 class="section-title">📰 Latest Crypto News</h2>
                <div id="newsContainer" class="news-container">
                    <div class="loading-container">
                        <div class="spinner"></div>
                        <p>Loading latest news...</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Coin Detail Modal -->
        <div id="coinModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <div id="modalContent"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>💡 Built with ❤️ using React Native Web • Data from CoinGecko API</p>
            <p>📱 Optimized for all devices • No login required</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
